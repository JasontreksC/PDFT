<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDFT — PDF 번역기</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6df6'/%3E%3Cpath d='M9 8h9a5 5 0 010 10h-5v6H9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/api/fonts.css">
</head>
<body>
  <header id="menubar">
    <div class="brand"><span class="logo">P</span>PDFT</div>
    <button class="menu-btn" id="btn-sidebar" title="쪽 목록 보이기/숨기기" aria-pressed="true">▤ 쪽</button>

    <nav id="menus">
      <div class="menu" data-menu="file">
        <button class="menu-btn" aria-haspopup="true">파일</button>
        <div class="dropdown" role="menu">
          <button class="item" id="m-open">PDF 열기…</button>
          <button class="item" id="m-export">번역된 PDF 저장</button>
          <button class="item" id="m-export-sel" title="왼쪽 목록에서 선택한 쪽만 새 PDF로 저장합니다.">선택한 쪽만 PDF 저장</button>
          <div class="sep"></div>
          <div class="group-title">최근 작업</div>
          <div id="recent" class="recent"></div>
          <button class="item danger" id="m-delete-others" hidden>다른 작업 모두 삭제</button>
        </div>
      </div>

      <div class="menu" data-menu="translate">
        <button class="menu-btn" aria-haspopup="true">번역</button>
        <div class="dropdown" role="menu">
          <label class="field">
            <span>번역할 언어</span>
            <select id="s-lang"></select>
          </label>
          <div class="sep"></div>
          <button class="item" id="m-start">번역 시작</button>
          <button class="item" id="m-stop">번역 중지</button>
          <button class="item" id="m-rebuild" title="문서를 다시 분석합니다 (저장된 Docling 결과가 있으면 그것을 재사용). 원문이 같은 글의 번역은 그대로 옮겨집니다.">구조 다시 정리</button>
          <button class="item danger" id="m-reset" title="선택한 쪽의 번역만 지웁니다 (전체 선택이면 내부 컨텍스트도 초기화).">번역 초기화</button>
          <button class="item danger" id="m-delete">이 작업 삭제</button>
        </div>
      </div>

      <div class="menu" data-menu="model">
        <button class="menu-btn" aria-haspopup="true">모델 <small id="model-name"></small></button>
        <div class="dropdown wide" role="menu">
          <div class="group-title">번역 모델</div>
          <div id="model-list" class="model-list"></div>
          <div id="model-errors" class="warn" hidden></div>
          <div class="sep"></div>
          <div class="group-title">컨텍스트 한도</div>
          <div class="ctx-row">
            <strong id="ctx-limit">—</strong>
            <span id="ctx-source" class="muted"></span>
            <button class="link" id="ctx-refresh" title="모델 API에서 다시 조회">다시 조회</button>
          </div>
          <div class="gauge-big" id="gauge-big"><i></i></div>
          <div class="muted small" id="gauge-detail"></div>
          <label class="check" title="번역한 내용을 모아 짧은 맥락 요약과 용어집으로 정리합니다. 요청마다 보내는 것은 이 요약과 용어집뿐입니다."><input type="checkbox" id="s-auto"> 맥락 요약 자동 갱신</label>
          <div class="sep"></div>
          <div class="group-title">속도</div>
          <label class="slider-row" title="동시에 번역할 쪽 수. 높일수록 빠르지만 API 요청 한도(429)에 걸리기 쉽고, 같은 시점의 쪽끼리는 서로의 번역·용어를 보지 못합니다 (1 = 순차).">
            <span>동시 요청</span>
            <input type="range" id="s-conc" min="1" max="16" step="1">
            <output id="s-conc-out"></output>
          </label>
          <div class="muted small" style="padding:0 10px 2px">쪽 단위로 동시에 번역합니다. 1이면 순차(용어 일관성 최대).</div>
          <div class="row-btns">
            <button class="btn small" id="ctx-compress">요약 지금 갱신</button>
            <button class="btn small ghost" id="models-reload">models.json 다시 읽기</button>
          </div>
        </div>
      </div>

      <div class="menu" data-menu="font">
        <button class="menu-btn" aria-haspopup="true">글꼴 <small id="font-name"></small></button>
        <div class="dropdown" role="menu">
          <div class="group-title">기본 글꼴 (번역문 전체)</div>
          <div id="font-list" class="font-list"></div>
        </div>
      </div>
    </nav>

    <div class="spacer"></div>

    <div class="analyze" id="analyze-box">
      <label class="an-force" id="an-force" title="켜면 로컬 Docling이 읽은 구역을 '이 줄들이 한 글인가' 판단의 힌트로 씁니다. 스캔 쪽(텍스트 층 없음)이 있으면 글자를 읽기 위해 항상 사용합니다."><input type="checkbox" id="s-parser"> Docling 힌트</label>
      <span id="an-est" class="an-est"></span>
      <button id="btn-analyze" class="btn" disabled>문서 분석</button>
    </div>

    <button id="gauge" class="gauge" title="요청마다 보내는 맥락 / 모델 한도">
      <span class="g-label">컨텍스트</span>
      <span class="g-bar"><i class="g-fill"></i></span>
      <span class="g-num">— / —</span>
    </button>
    <button id="btn-main" class="btn primary" disabled>번역 시작</button>
    <button id="btn-export" class="btn" disabled>PDF 저장</button>
  </header>

  <div id="workspace">
  <aside id="sidebar" aria-label="쪽 목록">
    <div class="sb-head">
      <div class="sb-title"><strong>쪽</strong> <span id="sb-count" class="muted"></span></div>
      <div class="sb-btns">
        <button class="btn small" id="sb-all" title="모든 쪽 선택">전체 선택</button>
        <button class="btn small ghost" id="sb-none" title="선택 모두 해제">전체 해제</button>
      </div>
      <button class="btn small" id="sb-revert" title="선택한 쪽의 번역과 서식 변경을 지우고 원본 상태로 되돌립니다 (다른 쪽은 그대로).">↩ 번역 전으로</button>
      <div class="sb-hint muted">선택한 쪽만 번역·초기화·저장합니다. Shift+클릭: 범위 선택</div>
    </div>
    <div id="thumbs" role="listbox" aria-multiselectable="true"></div>
  </aside>
  <main id="viewer">
    <div id="empty">
      <div class="drop">
        <div class="drop-icon">PDF</div>
        <h1>번역할 PDF를 끌어다 놓으세요</h1>
        <p>PDF의 글자와 위치를 그대로 읽어 원본 쪽 위에 번역문을 얹습니다. 선·표·그림·로고는 원본 그대로 남습니다.</p>
        <button class="btn primary" id="btn-pick">파일 선택</button>
      </div>
    </div>
    <div id="pages"></div>
  </main>
  </div>

  <div id="lay-bar" hidden>
    <strong>분석 보기</strong>
    <label title="로컬 Docling 서비스가 인식한 구역 그대로"><input type="checkbox" id="lay-doc" checked><i class="sw sw-doc"></i> Docling 구역 <span id="lay-doc-n" class="muted"></span></label>
    <label title="PDF 텍스트 층에서 만든 글상자 (번역 단위)"><input type="checkbox" id="lay-fr" checked><i class="sw sw-fr"></i> 글상자 <span id="lay-fr-n" class="muted"></span></label>
    <span id="lay-note" class="muted"></span>
  </div>

  <div id="zoom">
    <button id="z-layout" aria-pressed="false" title="분석 결과 보기: Docling이 인식한 구역과 글상자를 원본 쪽 위에 그립니다">▦ 분석</button>
    <button id="z-out" aria-label="축소">−</button>
    <button id="z-fit" title="너비에 맞춤">100%</button>
    <button id="z-in" aria-label="확대">＋</button>
  </div>

  <footer id="statusbar">
    <span id="st-msg">PDF를 열어 시작하세요.</span>
    <span class="st-bar"><i id="st-fill"></i></span>
    <span id="st-right" class="muted"></span>
  </footer>

  <!-- 글을 클릭하면 바로 위에 뜨는 컨트롤 패널: 글꼴 · 굵기 · 크기 · 색 (이 네 가지만) -->
  <div id="panel" hidden role="toolbar" aria-label="텍스트 서식">
    <label class="p-font"><span>글꼴</span><select id="p-font"></select></label>
    <label class="p-weight"><span>굵기</span><input type="range" id="p-weight" min="0" max="8" step="1"><output id="p-weight-out">400</output></label>
    <label class="p-size"><span>크기</span>
      <button type="button" id="p-dec" aria-label="작게">−</button>
      <input type="number" id="p-size" min="2" max="400" step="0.5">
      <button type="button" id="p-inc" aria-label="크게">＋</button>
    </label>
    <label class="p-color"><span>색</span><input type="color" id="p-color"></label>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
  <script type="module" src="/app.js"></script>
</body>
</html>
